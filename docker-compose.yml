
services:

  # ── 1. MySQL 数据库 ────────────────────────────────────────
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456789Yj
      MYSQL_DATABASE: bank_core
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql   # 自动初始化建表+数据
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banknet

  # ── 1.5 Redis 缓存队列 ──────────────────────────────────────
  redis:
    image: redis:7.0-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banknet

  # ── 2. 银行 API 服务（FastAPI + uvicorn） ─────────────────
  bank-server:
    build: .
    command: uvicorn bank_server.main:app --host 0.0.0.0 --port 8000
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=123456789Yj
      - DB_NAME=bank_core
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - banknet

  # ── 3. 测试执行容器 ────────────────────────────────────────
  api-tests:
    build: .
    command: >
      sh -c "pytest test_cases/ -v
             --alluredir=./allure-results
             --tb=short
             -x || true"
    environment:
      - BASE_URL=http://bank-server:8000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=123456789Yj
      - DB_NAME=bank_core
    depends_on:
      bank-server:
        condition: service_healthy
    volumes:
      # 把 allure-results 持久化到宿主机，防止容器销毁后报告丢失
      - ./allure-results:/app/allure-results
    networks:
      - banknet
    profiles:
      # 不随 docker compose up 自动启动，由 Jenkinsfile 单独 docker compose run
      - test

networks:
  banknet:
    driver: bridge
