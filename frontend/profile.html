<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>星辰银行 - 个人中心</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="page-header">
      <div class="page-title">👤 个人中心</div>
      <div class="page-subtitle">管理个人资料与安全设置</div>
    </div>

    <div class="grid grid-2">
      <!-- 个人资料 -->
      <div class="card">
        <div class="font-bold mb-16">📋 基本资料</div>
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input id="p-username" class="form-input" disabled>
        </div>
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input id="p-phone" class="form-input" disabled>
        </div>
        <div class="form-group">
          <label class="form-label">真实姓名</label>
          <input id="p-real-name" class="form-input" placeholder="请填写真实姓名">
        </div>
        <div class="form-group">
          <label class="form-label">邮箱地址</label>
          <input id="p-email" class="form-input" placeholder="请填写邮箱">
        </div>
        <div class="form-group">
          <label class="form-label">KYC 认证状态</label>
          <div id="p-kyc" class="mt-8"></div>
        </div>
        <button class="btn btn-primary btn-full" onclick="saveProfile()">💾 保存资料</button>
      </div>

      <!-- 安全设置 -->
      <div class="card">
        <div class="font-bold mb-16">🔐 安全设置</div>
        <div class="form-group">
          <label class="form-label">当前密码</label>
          <input id="old-pass" class="form-input" type="password" placeholder="请输入当前密码">
        </div>
        <div class="form-group">
          <label class="form-label">新密码（至少8位）</label>
          <input id="new-pass" class="form-input" type="password" placeholder="请输入新密码">
        </div>
        <div class="form-group">
          <label class="form-label">确认新密码</label>
          <input id="confirm-pass" class="form-input" type="password" placeholder="请再次输入新密码">
        </div>
        <button class="btn btn-danger btn-full" onclick="changePass()">🔒 修改密码</button>

        <div style="margin-top:32px; padding-top:24px; border-top:1px solid var(--border)">
          <div class="font-bold mb-8">🚪 退出登录</div>
          <p class="text-muted text-sm mb-16">退出后需重新登录才能访问账户</p>
          <button class="btn btn-secondary btn-full" onclick="logout()">退出当前账号</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script>
  const kycLabel = { verified:'✅ 已认证', pending:'⏳ 审核中', unverified:'❌ 未认证' };
  const kycClass = { verified:'badge-green', pending:'badge-yellow', unverified:'badge-red' };

  (async () => {
    if (!Auth.check()) return;
    const res = await BankAPI.getProfile();
    if (!res) return;
    const d = res.data;
    document.getElementById('p-username').value  = d.username || '';
    document.getElementById('p-phone').value     = d.phone    || '';
    document.getElementById('p-real-name').value = d.real_name || '';
    document.getElementById('p-email').value     = d.email    || '';
    document.getElementById('p-kyc').innerHTML   =
      `<span class="badge ${kycClass[d.kyc_status]||'badge-red'}">${kycLabel[d.kyc_status]||'未认证'}</span>`;
  })();

  async function saveProfile() {
    const real_name = document.getElementById('p-real-name').value.trim();
    const email     = document.getElementById('p-email').value.trim();
    if (!real_name && !email) return Toast.error('至少填写一项');
    const body = {};
    if (real_name) body.real_name = real_name;
    if (email)     body.email     = email;
    const res = await BankAPI.updateProfile(body);
    if (res) Toast.success('资料已更新');
  }

  async function changePass() {
    const old_password = document.getElementById('old-pass').value;
    const new_password = document.getElementById('new-pass').value;
    const confirm      = document.getElementById('confirm-pass').value;
    if (!old_password || !new_password) return Toast.error('请填写完整信息');
    if (new_password !== confirm) return Toast.error('两次密码不一致');
    const res = await BankAPI.changePassword({ old_password, new_password });
    if (!res) return;
    Toast.success('密码修改成功，请重新登录');
    setTimeout(() => { Auth.clear(); location.href = 'login.html'; }, 1500);
  }
</script>
</body>
</html>
